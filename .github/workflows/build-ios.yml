name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build & Package IPA
        run: |
          set -euo pipefail
          echo "Building in $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/PinyinGame.xcodeproj/" | head -5
          xcodebuild build \
            -project "$GITHUB_WORKSPACE/PinyinGame.xcodeproj" \
            -scheme PinyinGame \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR="$GITHUB_WORKSPACE/build" \
            2>&1 | tee build.log | tail -30
          echo "Build exit: $?"
          ls -la "$GITHUB_WORKSPACE/build/Release-iphoneos/PinyinGame.app/" | head -10

      - name: Create IPA
        run: |
          APP_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos/PinyinGame.app"
          PAYLOAD="$GITHUB_WORKSPACE/Payload"
          mkdir -p "$PAYLOAD"
          cp -R "$APP_DIR" "$PAYLOAD/"
          cd "$GITHUB_WORKSPACE"
          zip -r PinyinGame.ipa Payload/
          ls -lh PinyinGame.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinyinGame.ipa
          path: PinyinGame.ipa
          retention-days: 30
