name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos
          swift --version
          uname -m

      - name: Build with swiftc
        run: |
          set -euo pipefail
          echo "=== swiftc compile ==="
          
          # Get SDK path
          SDK_PATH=$(xcrun --show-sdk-path --sdk iphoneos)
          echo "SDK: $SDK_PATH"
          TARGET="arm64-apple-ios14.0"
          
          # Compile
          xcrun swiftc \
            -target $TARGET \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -o "$GITHUB_WORKSPACE/build/PinyinGame" \
            -module-name PinyinGame \
            "$GITHUB_WORKSPACE/PinyinGame/GameView.swift" \
            -framework SwiftUI \
            -framework WebKit \
            -framework UIKit \
            -framework Foundation \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          
          RC=${PIPESTATUS[0]}
          echo "=== swiftc exit=$RC ==="
          if [ $RC -ne 0 ]; then
            echo "SWIFTC FAILED"
            cat "$GITHUB_WORKSPACE/build.log"
            exit 1
          fi
          
          echo "=== Binary info ==="
          file "$GITHUB_WORKSPACE/build/PinyinGame"
          ls -lh "$GITHUB_WORKSPACE/build/PinyinGame"
          
          # Ad-hoc codesign
          echo "=== Ad-hoc codesign ==="
          codesign -s - -f "$GITHUB_WORKSPACE/build/PinyinGame"
          echo "codesign OK"
          
          # Create .app bundle
          echo "=== Assembling PinyinGame.app ==="
          APP_DIR="$GITHUB_WORKSPACE/build/PinyinGame.app"
          mkdir -p "$APP_DIR"
          cp "$GITHUB_WORKSPACE/build/PinyinGame" "$APP_DIR/PinyinGame"
          codesign -s - -f "$APP_DIR/PinyinGame"
          
          # Info.plist
          cp "$GITHUB_WORKSPACE/PinyinGame/Info.plist" "$APP_DIR/Info.plist"
          
          # Resources
          mkdir -p "$APP_DIR"
          if [ -f "$GITHUB_WORKSPACE/PinyinGame/index.html" ]; then
            cp "$GITHUB_WORKSPACE/PinyinGame/index.html" "$APP_DIR/"
          fi
          if [ -d "$GITHUB_WORKSPACE/PinyinGame/audio" ]; then
            cp -R "$GITHUB_WORKSPACE/PinyinGame/audio" "$APP_DIR/"
          fi
          if [ -d "$GITHUB_WORKSPACE/PinyinGame/mouth-shapes" ]; then
            cp -R "$GITHUB_WORKSPACE/PinyinGame/mouth-shapes" "$APP_DIR/"
          fi
          if [ -d "$GITHUB_WORKSPACE/PinyinGame/Assets.xcassets" ]; then
            # Compile asset catalog to Assets.car
            xcrun actutil compile \
              --output-format car \
              --platform iphoneos \
              --minimum-deployment-target 14.0 \
              "$GITHUB_WORKSPACE/PinyinGame/Assets.xcassets" \
              "$APP_DIR/Assets.car" 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log" || true
          fi
          
          echo "=== .app contents ==="
          find "$APP_DIR" -type f | sort
          echo ""
          echo "=== IPA ready ==="

      - name: Create IPA
        run: |
          set -euo pipefail
          APP_DIR="$GITHUB_WORKSPACE/build/PinyinGame.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "FATAL: $APP_DIR not found"
            find "$GITHUB_WORKSPACE/build" -maxdepth 3
            exit 1
          fi
          
          # Verify binary exists
          if [ ! -f "$APP_DIR/PinyinGame" ]; then
            echo "FATAL: binary missing in $APP_DIR"
            ls -la "$APP_DIR/"
            exit 1
          fi
          
          echo "Binary: $(file "$APP_DIR/PinyinGame")"
          echo "Size: $(ls -lh "$APP_DIR/PinyinGame" | awk '{print $5}')"
          
          # Create Payload
          PAYLOAD="$GITHUB_WORKSPACE/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -R "$APP_DIR" "$PAYLOAD/"
          
          # Zip
          cd "$GITHUB_WORKSPACE"
          zip -r PinyinGame.ipa Payload/
          echo ""
          echo "=== IPA ==="
          ls -lh PinyinGame.ipa
          echo "=== IPA contents (first 20) ==="
          unzip -l PinyinGame.ipa | head -20

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: build.log
          retention-days: 7
        if: always()

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PinyinGame.ipa
          path: PinyinGame.ipa
          retention-days: 30
