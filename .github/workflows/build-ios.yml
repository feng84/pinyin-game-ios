name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -euo pipefail
          echo "=== Building $GITHUB_WORKSPACE ==="
          ls "$GITHUB_WORKSPACE/PinyinGame.xcodeproj/"
          xcodebuild build \
            -project "$GITHUB_WORKSPACE/PinyinGame.xcodeproj" \
            -scheme PinyinGame \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR="$GITHUB_WORKSPACE/build" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "=== xcodebuild done (exit=$?) ==="

      - name: Verify & Create IPA
        run: |
          set -euo pipefail
          echo "=== Check build output ==="
          APP_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos/PinyinGame.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "APP_DIR missing. Build dir:"
            find "$GITHUB_WORKSPACE/build" -maxdepth 3 -type d
            find "$GITHUB_WORKSPACE/build" -name "*.app" 2>/dev/null
            echo "---build.log tail---"
            tail -50 "$GITHUB_WORKSPACE/build.log"
            exit 1
          fi
          echo "App contents:"
          ls -la "$APP_DIR/"
          PAYLOAD="$GITHUB_WORKSPACE/Payload"
          mkdir -p "$PAYLOAD"
          cp -R "$APP_DIR" "$PAYLOAD/"
          cd "$GITHUB_WORKSPACE"
          zip -r PinyinGame.ipa Payload/
          ls -lh PinyinGame.ipa

      - name: Upload log (debug)
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: build.log
          retention-days: 7
        if: always()

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinyinGame.ipa
          path: PinyinGame.ipa
          retention-days: 30
