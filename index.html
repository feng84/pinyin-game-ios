<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一年级拼音闯关之旅</title>
<style>
/* ============ Cute Design System ============ */
:root {
  --pink: #FF7EB3;
  --pink-light: #FFB6D3;
  --pink-bg: #FFF0F5;
  --peach: #FFB088;
  --purple: #C4A6FF;
  --purple-light: #E8DFFF;
  --mint: #7ED9C4;
  --mint-light: #C8F0E4;
  --yellow: #FFD93D;
  --yellow-light: #FFF3B8;
  --sky: #87CEEB;
  --sky-light: #C5E8F7;
  --green: #6BCB77;
  --red: #FF6B6B;
  --text: #5D4E6D;
  --text-light: #9B8EAA;
  --white: #FFFFFF;
  --shadow-card: 0 6px 20px rgba(180,160,200,0.15);
  --shadow-hover: 0 10px 30px rgba(180,160,200,0.25);
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 26px;
  --radius-xl: 34px;
  --bounce: cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background: linear-gradient(170deg, #FFF0F8 0%, #F8F0FF 25%, #F0F8FF 50%, #FFF8F0 75%, #FFF0F5 100%);
  background-attachment: fixed;
  min-height: 100vh; color: var(--text);
  overflow-x: hidden;
}

/* ============ Floating Bubbles ============ */
.bubbles-bg { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
.bubble { position:absolute; border-radius:50%; opacity:0.35; animation:floatUp linear infinite; }
@keyframes floatUp {
  0% { transform:translateY(105vh) scale(0); opacity:0; }
  10% { opacity:0.4; }
  90% { opacity:0.4; }
  100% { transform:translateY(-10vh) scale(1); opacity:0; }
}

/* ============ Header ============ */
.header {
  background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 50%, var(--sky) 100%);
  color:#fff; padding:26px 16px 20px; text-align:center;
  border-radius:0 0 var(--radius-xl) var(--radius-xl);
  box-shadow:0 8px 30px rgba(200,150,220,0.3);
  position:relative; overflow:hidden; z-index:2;
}
.header h1 { font-size:26px; letter-spacing:2px; text-shadow:0 2px 6px rgba(0,0,0,0.15); }
.header .subtitle { margin-top:6px; font-size:14px; opacity:0.95; }
.header .star-total {
  display:inline-flex; align-items:center; gap:6px; margin-top:10px;
  background:rgba(255,255,255,0.25); padding:6px 16px; border-radius:20px;
  font-size:15px; font-weight:bold;
}

/* ============ Main container ============ */
.container { max-width:900px; margin:0 auto; padding:20px 16px 60px; position:relative; z-index:1; }
.screen { display:none; animation:fadeIn 0.4s ease; }
.screen.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(12px);} to { opacity:1; transform:translateY(0);} }

/* ============ Level Map ============ */
.map-title { text-align:center; font-size:20px; font-weight:bold; margin:18px 0 6px; }
.map-sub { text-align:center; font-size:13px; color:var(--text-light); margin-bottom:18px; }
.level-grid { display:flex; flex-direction:column; gap:14px; }
.level-row { display:flex; align-items:center; gap:14px; background:var(--white);
  border-radius:var(--radius-lg); padding:14px 16px; box-shadow:var(--shadow-card);
  cursor:pointer; transition:transform 0.25s var(--bounce), box-shadow 0.25s; border:3px solid transparent;
}
.level-row:nth-child(odd) { margin-right:24px; }
.level-row:nth-child(even) { margin-left:24px; }
.level-row:hover { transform:translateY(-3px) scale(1.01); box-shadow:var(--shadow-hover); }
.level-row.locked { cursor:not-allowed; opacity:0.55; filter:grayscale(0.7); }
.level-row.locked:hover { transform:none; box-shadow:var(--shadow-card); }
.level-num {
  width:58px; height:58px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:bold; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,0.15);
  box-shadow:inset 0 -4px 8px rgba(0,0,0,0.08);
}
.level-info { flex:1; min-width:0; }
.level-name { font-size:17px; font-weight:bold; }
.level-py { font-size:13px; color:var(--text-light); margin-top:3px; letter-spacing:1px; }
.level-stars { font-size:20px; letter-spacing:2px; flex-shrink:0; }
.reset-btn {
  display:block; margin:30px auto 0; background:var(--white); color:var(--text-light);
  border:2px dashed #D8CCE8; border-radius:20px; padding:8px 22px; font-size:13px; cursor:pointer;
  font-family:inherit; transition:all 0.2s;
}
.reset-btn:hover { color:var(--red); border-color:var(--red); }

/* ============ Learn Screen ============ */
.topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.back-btn {
  background:var(--white); border:none; border-radius:16px; padding:9px 18px;
  font-size:15px; font-weight:bold; color:var(--text); cursor:pointer;
  box-shadow:var(--shadow-card); font-family:inherit; transition:transform 0.2s var(--bounce);
}
.back-btn:hover { transform:scale(1.06); }
.level-badge {
  font-size:16px; font-weight:bold; color:#fff; padding:9px 20px; border-radius:20px;
  box-shadow:var(--shadow-card);
}
.chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
.chip {
  border:none; border-radius:14px; padding:8px 14px; font-size:16px; font-weight:bold;
  font-family:inherit; cursor:pointer; background:var(--white); color:var(--text-light);
  box-shadow:var(--shadow-card); transition:all 0.2s var(--bounce);
}
.chip.active { background:var(--purple); color:#fff; transform:scale(1.12); }
.learn-card {
  background:var(--white); border-radius:var(--radius-xl); padding:26px 22px;
  box-shadow:var(--shadow-card); text-align:center; animation:cardPop 0.35s var(--bounce);
}
@keyframes cardPop { from { transform:scale(0.9); opacity:0; } to { transform:scale(1); opacity:1; } }
.py-type {
  display:inline-block; font-size:13px; font-weight:bold; color:#fff;
  padding:4px 14px; border-radius:12px; margin-bottom:10px; letter-spacing:1px;
}
.big-py { font-size:96px; font-weight:900; line-height:1.1; cursor:pointer; text-align:center; white-space:nowrap; }
.py-tip {
  font-size:15px; color:var(--text-light); background:var(--yellow-light);
  display:inline-block; padding:6px 18px; border-radius:14px; margin:8px 0 18px;
}
.char-block {
  border-radius:var(--radius-md); padding:16px 14px; margin:10px 0; text-align:left;
}
.char-block.a { background:var(--pink-bg); }
.char-block.b { background:var(--sky-light); }
.char-head { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.char-itself { font-size:52px; font-weight:900; line-height:1; }
.char-py { font-size:24px; font-weight:bold; color:var(--purple); }
.speak-btn {
  margin-left:auto; border:none; background:var(--white); border-radius:50%;
  width:40px; height:40px; font-size:18px; cursor:pointer; box-shadow:var(--shadow-card);
  transition:transform 0.2s var(--bounce); font-family:inherit;
}
.speak-btn:hover { transform:scale(1.15); }
.idiom-title { font-size:13px; color:var(--text-light); margin-bottom:8px; font-weight:bold; }
.idiom-list { display:flex; flex-wrap:wrap; gap:8px; }
.idiom {
  background:var(--white); border-radius:12px; padding:8px 12px; font-size:17px; font-weight:bold;
  box-shadow:0 2px 8px rgba(180,160,200,0.18); cursor:pointer; transition:transform 0.2s var(--bounce);
  letter-spacing:1px;
}
.idiom:hover { transform:scale(1.06); background:var(--mint-light); }
.learn-nav { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
.nav-btn {
  flex:1; border:none; border-radius:18px; padding:14px 10px; font-size:16px; font-weight:bold;
  font-family:inherit; cursor:pointer; color:#fff; box-shadow:var(--shadow-card);
  transition:transform 0.2s var(--bounce); max-width:180px;
}
.nav-btn:hover { transform:translateY(-2px); }
.nav-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
.start-quiz-btn {
  flex:2.2; border:none; border-radius:18px; padding:14px 10px; font-size:18px; font-weight:bold;
  font-family:inherit; cursor:pointer; color:#fff; box-shadow:0 6px 20px rgba(255,140,120,0.4);
  background:linear-gradient(135deg,#FF9A76,#FF6B9B); letter-spacing:2px;
  transition:transform 0.2s var(--bounce);
}
.start-quiz-btn:hover { transform:translateY(-2px) scale(1.02); }

/* ============ Quiz ============ */
.quiz-card {
  background:var(--white); border-radius:var(--radius-xl); padding:24px 20px;
  box-shadow:var(--shadow-card); text-align:center; animation:cardPop 0.35s var(--bounce);
}
.quiz-progress { display:flex; gap:6px; justify-content:center; margin-bottom:16px; }
.q-dot { width:12px; height:12px; border-radius:50%; background:#E8E0F0; transition:all 0.3s; }
.q-dot.done { background:var(--green); }
.q-dot.now { background:var(--purple); transform:scale(1.4); }
.q-count { font-size:13px; color:var(--text-light); margin-bottom:10px; font-weight:bold; }
.q-prompt { font-size:24px; font-weight:bold; margin:6px 0 20px; line-height:1.5; letter-spacing:1px; }
.q-prompt .blank { color:var(--pink); font-size:30px; }
.q-prompt .py-hl { color:var(--purple); font-size:30px; }
.q-char { font-size:72px; font-weight:900; line-height:1.2; margin:2px 0 16px; cursor:pointer; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.opt-btn {
  border:3px solid #EEE5F5; border-radius:var(--radius-md); background:var(--white);
  padding:16px 10px; font-size:24px; font-weight:bold; font-family:inherit; cursor:pointer;
  color:var(--text); transition:all 0.2s var(--bounce); letter-spacing:1px;
}
.opt-btn:hover:not(:disabled) { border-color:var(--purple-light); transform:translateY(-2px); background:var(--purple-light); }
.opt-btn:disabled { cursor:default; }
.opt-btn.correct { background:var(--mint-light); border-color:var(--green); color:#2E7D4F; animation:optBounce 0.5s var(--bounce); }
.opt-btn.wrong { background:#FFE3E3; border-color:var(--red); color:#C0392B; animation:shake 0.4s; }
@keyframes optBounce { 0%{transform:scale(1);} 40%{transform:scale(1.1);} 100%{transform:scale(1);} }
@keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
.feedback { min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin-top:16px; gap:8px; }
.feedback span { font-size:20px; font-weight:bold; padding:8px 22px; border-radius:20px; animation:cardPop 0.3s var(--bounce); }
.feedback .good { background:var(--mint-light); color:#2E7D4F; }
.feedback .bad { background:#FFE3E3; color:#C0392B; }
.q-reveal { font-size:15px; background:var(--yellow-light); padding:7px 16px; border-radius:12px; color:var(--text); animation:cardPop 0.3s var(--bounce); }
.spell-built { text-align:center; font-size:24px; font-weight:bold; color:var(--purple); margin-top:14px; letter-spacing:2px; }
.spell-built:empty { display:none; }
.options .spell-label { grid-column:1/-1; text-align:center; font-size:15px; font-weight:bold; color:var(--purple); padding-bottom:4px; }
.spell-line { background:rgba(255,255,255,0.8); border-radius:12px; padding:8px 12px; font-size:15px; margin-bottom:10px; line-height:1.7; }
.spell-line b { color:var(--purple); font-size:17px; }

/* ============ Result ============ */
.result-card {
  background:var(--white); border-radius:var(--radius-xl); padding:34px 22px;
  box-shadow:var(--shadow-card); text-align:center; animation:cardPop 0.4s var(--bounce);
}
.result-emoji { font-size:64px; }
.result-title { font-size:28px; font-weight:900; margin:10px 0; }
.result-stars { font-size:54px; letter-spacing:6px; margin:10px 0 6px; }
.result-stars .star { display:inline-block; animation:starPop 0.5s var(--bounce) backwards; }
.result-stars .star:nth-child(2){ animation-delay:0.2s; }
.result-stars .star:nth-child(3){ animation-delay:0.4s; }
@keyframes starPop { from { transform:scale(0) rotate(-90deg);} to { transform:scale(1) rotate(0);} }
.result-msg { font-size:16px; color:var(--text-light); margin-bottom:8px; }
.result-score { font-size:15px; color:var(--text-light); margin-bottom:22px; }
.result-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.result-btn {
  border:none; border-radius:18px; padding:13px 26px; font-size:16px; font-weight:bold;
  font-family:inherit; cursor:pointer; color:#fff; box-shadow:var(--shadow-card);
  transition:transform 0.2s var(--bounce); letter-spacing:1px;
}
.result-btn:hover { transform:translateY(-2px); }

/* ============ Confetti ============ */
.confetti { position:fixed; top:-20px; z-index:99; pointer-events:none; border-radius:4px; animation:confettiFall linear forwards; }
@keyframes confettiFall {
  0% { transform:translateY(0) rotate(0deg); opacity:1; }
  100% { transform:translateY(110vh) rotate(720deg); opacity:0.6; }
}

/* ============ Toast ============ */
.toast {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(93,78,109,0.92); color:#fff; font-size:18px; font-weight:bold;
  padding:14px 30px; border-radius:22px; z-index:100; animation:cardPop 0.3s var(--bounce);
  pointer-events:none;
}

@media (max-width:520px) {
  .header h1 { font-size:21px; }
  .big-py { font-size:60px; }
  .char-itself { font-size:42px; }
  .q-prompt { font-size:20px; }
  .q-prompt .py-hl { font-size:26px; }
  .q-char { font-size:56px; }
  .opt-btn { font-size:20px; padding:14px 6px; }
  .level-row:nth-child(odd) { margin-right:8px; }
  .level-row:nth-child(even) { margin-left:8px; }
  .level-num { width:48px; height:48px; font-size:20px; }
}

/* 口型图展示 */
#mouth-panel {
  display:none;
  position:fixed;
  bottom:12px; right:12px;
  width:220px;
  background:rgba(255,255,255,.95);
  border-radius:14px;
  box-shadow:0 4px 24px rgba(0,0,0,.25);
  z-index:999;
  overflow:hidden;
  border:2px solid #FFD700;
}
#mouth-panel img {
  width:100%; height:auto; display:block;
}
#mouth-panel .mp-label {
  font-size:13px; color:#555; text-align:center;
  padding:6px 8px; font-weight:600; background:#FFF8DC;
}
#mouth-close {
  position:absolute; top:6px; right:8px;
  font-size:20px; color:#999; cursor:pointer;
  background:none; border:none; font-weight:bold;
}

/* === 卡通卡 === */
#cartoon-panel { display:none; position:fixed; bottom:120px; right:16px; z-index:999;
  background:linear-gradient(135deg,#fff3e0,#ffe0b2); border:3px solid #ff9800; border-radius:20px;
  padding:16px 20px; box-shadow:0 6px 20px rgba(255,152,0,.3); text-align:center; max-width:220px; }
#cartoon-panel .emoji { font-size:56px; line-height:1.2; }
#cartoon-panel .char-big { font-size:48px; font-weight:900; color:#e65100; margin:4px 0; }
#cartoon-panel .mnemonic { font-size:13px; color:#bf360c; line-height:1.5; }
#cartoon-close { position:absolute; top:6px; right:10px; cursor:pointer; font-size:18px; color:#999; }


/* === py-row layout: mouth left, big-py center, cartoon right === */
.py-row {
  display:flex; align-items:center; justify-content:center;
  gap:8px; margin:4px 0; flex-wrap:wrap;
}
.py-mouth {
  display:none;
}
.py-mouth img {
  width:160px; height:160px; object-fit:cover;
  border-radius:12px; border:3px solid #87CEEB;
  display:block;
}
.py-mouth .mp-ph {
  font-size:60px; color:#2196F3;
}
.big-py {
  font-size:100px; font-weight:900; line-height:1;
  min-width:130px; text-align:center;
}
.py-cartoon {
  text-align:center; min-width:70px; max-width:100px; flex-shrink:0;
}
.py-cartoon .emoji { font-size:44px; line-height:1.2; }
.py-cartoon .char-display { font-size:32px; font-weight:900; color:#e65100; margin:4px 0; }
.py-cartoon .mnemonic { font-size:12px; color:#bf360c; line-height:1.3; max-width:120px; margin:0 auto; }
/* Hide old fixed panels to avoid duplication */
#mouth-panel, #cartoon-panel { display:none !important; }

</style>
</head>
<body>
<div class="bubbles-bg" id="bubblesBg"></div>

<div class="header">
  <h1>🎈 拼音闯关之旅 🎈</h1>
  <div class="subtitle">拼一拼 · 读一读 · 成语积累</div>
  <div class="star-total">⭐ <span id="totalStars">0</span> / <span id="maxStars">39</span> 颗星星</div>
</div>

<div class="container">
  <!-- 关卡地图 -->
  <div class="screen active" id="screenMap">
    <div class="map-title">🗺️ 选择关卡出发吧！</div>
    <div class="map-sub">每关学习 5 个拼音：拼声母、选韵母、辨声调，闯关赢星星 ⭐</div>
    <div class="level-grid" id="levelGrid"></div>
    <button class="reset-btn" id="resetBtn">🗑️ 清空进度，重新开始</button>
  </div>

  <!-- 学习 -->
  <div class="screen" id="screenLearn">
    <div class="topbar">
      <button class="back-btn" id="learnBack">🏠 返回地图</button>
      <div class="level-badge" id="learnBadge">第 1 关</div>
    </div>
    <div class="chips" id="learnChips"></div>
    <div class="learn-card" id="learnCard"></div>
    <div class="learn-nav">
      <button class="nav-btn" id="prevPy" style="background:linear-gradient(135deg,#B8A4D8,#9B8EC8);">⬅️ 上一个</button>
      <button class="start-quiz-btn" id="startQuiz">🚀 开始闯关！</button>
      <button class="nav-btn" id="nextPy" style="background:linear-gradient(135deg,#B8A4D8,#9B8EC8);">下一个 ➡️</button>
    </div>
  </div>

  <!-- 答题 -->
  <div class="screen" id="screenQuiz">
    <div class="topbar">
      <button class="back-btn" id="quizBack">↩️ 放弃闯关</button>
      <div class="level-badge" id="quizBadge">第 1 关</div>
    </div>
    <div class="quiz-card">
      <div class="quiz-progress" id="quizDots"></div>
      <div class="q-count" id="qCount"></div>
      <div class="q-prompt" id="qPrompt"></div>
      <div class="q-char" id="qChar"></div>
      <div class="options" id="qOptions"></div>
      <div class="spell-built" id="spellBuilt"></div>
      <div class="feedback" id="qFeedback"></div>
    </div>
  </div>

  <!-- 结果 -->
  <div class="screen" id="screenResult">
    <div class="result-card" id="resultCard"></div>
  </div>
</div>

<script>
/* ==================== 拼音数据（一年级全量：23声母+24韵母+16整体认读） ==================== */
const DATA = [
{ name:"拼音果园", emoji:"🍎", items:[
 {p:"b",type:"声母",tip:"右下半圆 b b b",chars:[
  {c:"白",py:"bái",idioms:["白手起家","真相大白","白头偕老"]},
  {c:"百",py:"bǎi",idioms:["百发百中","千方百计","百花齐放"]}]},
 {p:"p",type:"声母",tip:"右上半圆 p p p",chars:[
  {c:"平",py:"píng",idioms:["平分秋色","平易近人","四平八稳"]},
  {c:"破",py:"pò",idioms:["破釜沉舟","势如破竹","不攻自破"]}]},
 {p:"m",type:"声母",tip:"两个门洞 m m m",chars:[
  {c:"马",py:"mǎ",idioms:["马到成功","一马当先","万马奔腾"]},
  {c:"满",py:"mǎn",idioms:["满载而归","心满意足","满面春风"]}]},
 {p:"f",type:"声母",tip:"伞柄朝上 f f f",chars:[
  {c:"风",py:"fēng",idioms:["风和日丽","一路顺风","风调雨顺"]},
  {c:"飞",py:"fēi",idioms:["龙飞凤舞","飞蛾扑火","不翼而飞"]}]},
 {p:"d",type:"声母",tip:"左下半圆 d d d",chars:[
  {c:"大",py:"dà",idioms:["大显身手","大快人心","光明正大"]},
  {c:"东",py:"dōng",idioms:["东张西望","声东击西","旭日东升"]}]}
]},
{ name:"糖果城堡", emoji:"🍭", items:[
 {p:"t",type:"声母",tip:"伞柄朝下 t t t",chars:[
  {c:"天",py:"tiān",idioms:["天长地久","翻天覆地","坐井观天"]},

/* ==================== 进度存取 ==================== */
const SAVE_KEY = "pinyinQuest_v1";
let progress = { stars: DATA.map(()=>0) };
function loadProgress(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { const obj = JSON.parse(raw);
      if (obj && Array.isArray(obj.stars) && obj.stars.length === DATA.length) progress = obj; }
  } catch(e){}
}
function saveProgress(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch(e){} }
function totalStars(){ return progress.stars.reduce((a,b)=>a+b,0); }

/* ==================== 工具 ==================== */
function $(id){ return document.getElementById(id); }
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}
/* 气泡背景 */
(function makeBubbles(){
  const bg = $("bubblesBg");
  const colors = ["#FFB6D3","#C4A6FF","#7ED9C4","#FFD93D","#87CEEB"];
  for (let i=0;i<12;i++){
    const b = document.createElement("div");
    b.className = "bubble";
    const size = 20 + Math.random()*50;
    b.style.width = size+"px"; b.style.height = size+"px";
    b.style.left = Math.random()*100+"%";
    b.style.background = colors[i%colors.length];
    b.style.animationDuration = (14+Math.random()*16)+"s";
    b.style.animationDelay = (-Math.random()*20)+"s";
    bg.appendChild(b);
  }
})();

let audioCtx = null;
function tone(freq, dur, delay, type, vol){

function speak(text){
  try {
    if (!text) return;
    if (window.AUDIO_MAP && window.AUDIO_MAP[text]) {
      try { speechSynthesis.cancel(); } catch(e){}
      const a = new Audio(window.AUDIO_MAP[text]);
      a.play().catch(()=>{});
      return;
    }
  } catch(e){}
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    if (_ttsTimer){ clearInterval(_ttsTimer); _ttsTimer = null; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.85; u.pitch = 1.05; u.volume = 1;
    _ttsTimer = setInterval(()=>{ try{ if(!speechSynthesis.speaking) clearInterval(_ttsTimer); }catch(e){} }, 200);
    speechSynthesis.speak(u);

/* ==================== 拼音拆分与声调工具 ==================== */
const INITIALS = ["zh","ch","sh","b","p","m","f","d","t","n","l","g","k","h","j","q","x","r","z","c","s","y","w"];
const TONE_MARKS = { a:"āáǎà", o:"ōóǒò", e:"ēéěè", i:"īíǐì", u:"ūúǔù", "ü":"ǖǘǚǜ" };
const TONE_SYMBOLS = ["", "ˉ", "ˊ", "ˇ", "ˋ"];
function stripTone(py){
  for (const ch of py){
    for (const base in TONE_MARKS){
      const idx = TONE_MARKS[base].indexOf(ch);
      if (idx >= 0) return { base: py.split(ch).join(base), tone: idx + 1 };
    }
  }
  return { base: py, tone: 0 };
}
function addTone(base, tone){
  if (tone < 1 || tone > 4) return base;
  const ia = base.indexOf("a"), io = base.indexOf("o"), ie = base.indexOf("e"),
        iu = base.indexOf("ü"), ii = base.indexOf("i"), iuu = base.indexOf("u");
  let target = -1;
  if (ia >= 0) target = ia;
  else if (io >= 0) target = io;
  else if (ie >= 0) target = ie;
  else if (iu >= 0) target = iu;
  else if (ii >= 0 && iuu >= 0) target = (ii < iuu) ? iuu : ii; /* iu→标在后, ui→标在前 */
  else if (ii >= 0) target = ii;
  else if (iuu >= 0) target = iuu;
  if (target < 0) return base;
  const ch = base[target];
  return base.slice(0, target) + TONE_MARKS[ch][tone - 1] + base.slice(target + 1);
}
function splitPinyin(py){
  for (const ini of INITIALS){ if (py.startsWith(ini)) return { ini: ini, fin: py.slice(ini.length) }; }
  return { ini: "", fin: py };
}
function pinyinParts(ch){
  const sp = splitPinyin(ch.py);
  let fin0 = stripTone(sp.fin).base;
  /* j q x y 与 ü 相拼时去掉两点，这里还原成 ü，方便孩子认韵母 */
  if (["j","q","x","y"].indexOf(sp.ini) >= 0){
    if (fin0 === "u") fin0 = "ü";
    else if (fin0 === "ue") fin0 = "üe";
    else if (fin0 === "un") fin0 = "ün";
  }
  return { ini: sp.ini, fin0: fin0, fin: sp.fin, tone: stripTone(ch.py).tone };
}

/* ==================== 闯关测验（拼音拼写闯关） ==================== */
let quiz = [], qIndex = 0, qCorrect = 0, qAnswered = false, spellStep = 0, spellMistake = false;
function allChars(lv){ return lv.items.reduce((a,it)=>a.concat(it.chars),[]); }

function uniq(arr){ return Array.from(new Set(arr)); }

/* ============ 易混淆拼音对照表 ============ */
const ALL_FIN = ["a","o","e","i","u","ü","ai","ei","ui","ao","ou","iu","ie","üe","er","an","en","in","un","ün","ang","eng","ing","ong","ia","ua","uo","ian","iao","uan"];
const ALL_WHOLE = ["zhi","chi","shi","ri","zi","ci","si","yi","wu","yu","ye","yue","yuan","yin","yun","ying"];
const CONFUSE_INI = {
  b:["p","d"], p:["b","q"], d:["t","b"], t:["d","q"],
  g:["k","h"], k:["g","h"], h:["g","k"],
  n:["l","m"], l:["n","r"], m:["n","f"], f:["t","h"],
  j:["q","x"], q:["j","p"], x:["j","s"],
  zh:["z","ch","sh"], ch:["c","zh","sh"], sh:["s","zh","ch"],
  r:["l","sh"], z:["zh","c","s"], c:["ch","z","s"], s:["sh","z","c"],
  y:["w"], w:["y"]
};
const CONFUSE_FIN = {
  a:["o","e"], o:["e","uo"], e:["o","er"], i:["u","ü"], u:["ü","i"], ü:["u","i"],
  ai:["an","ei","ao"], ei:["ie","ai","ui"], ui:["iu","ei","un"], iu:["ui","ou"],
  ao:["ou","an"], ou:["ao","iu"], ie:["ei","üe"], üe:["ie","ei"], er:["e","o"],
  an:["ang","en","uan"], en:["eng","an","in"], in:["ing","en","ün"],
  un:["ün","en","ong"], ün:["un","in"],
  ang:["an","eng","ong"], eng:["ong","en","ang"], ing:["in","eng","ong"], ong:["eng","ang","un"],
  ia:["a","ie","iu"], ua:["a","uo","ai"], uo:["o","ua","ou"],
  ian:["in","an","ang"], iao:["ao","ou","iu"], uan:["an","ang","en"]
};
const CONFUSE_WHOLE = {
  zhi:["chi","shi","zi"], chi:["zhi","shi","ci"], shi:["zhi","chi","si"],
  ri:["li","shi","yi"], zi:["ci","si","zhi"], ci:["zi","si","chi"], si:["zi","ci","shi"],
  yi:["yu","ye","yin"], wu:["yu","hu","wa"], yu:["yi","wu","yue"],
  ye:["yue","yi"], yue:["ye","yuan"], yuan:["yue","yun"],
  yin:["ying","yi","yun"], yun:["yin","ying","yuan"], ying:["yin","yi"]
};
/* 优先取易混淆项做干扰项，不够再随机补齐 */
function confusable(answer, confuseMap, fallbackPool, n){
  const out = [];
  shuffle(confuseMap[answer] || []).forEach(x=>{ if (x !== answer && out.indexOf(x) < 0) out.push(x); });
  shuffle(fallbackPool).forEach(x=>{ if (x !== answer && out.indexOf(x) < 0) out.push(x); });
  return out.slice(0, n);
}
/* 答错时的辨析小提示 */
function confuseHint(ans){
  if (!ans) return "";
  const F = ["an","en","in","un"], B = ["ang","eng","ing","ong"];
  if (F.indexOf(ans) >= 0) return "💡 "+ans+" 是前鼻音（舌尖抵上牙床），"+ans+"g 是后鼻音（气从鼻子出），别混哦";
  if (B.indexOf(ans) >= 0) return "💡 "+ans+" 是后鼻音（气从鼻子出），"+ans.slice(0,-1)+" 才是前鼻音，注意区分";
  if (ans === "ün") return "💡 ün 是小鱼 ü 加 n（两点不能丢）；un 是乌鸦 u 加 n";
  if (ans === "un") return "💡 un 是乌鸦 u 加 n；ün 才是小鱼 ü（有两点）";
  if (["zh","ch","sh"].indexOf(ans) >= 0) return "💡 "+ans+" 是翘舌音（舌头翘起来），"+ans[0]+" 是平舌音（舌尖放平）";
  if (["z","c","s"].indexOf(ans) >= 0) return "💡 "+ans+" 是平舌音（舌尖放平），"+ans+"h 才是翘舌音";
  if (ans === "n") return "💡 n 是鼻音（气从鼻子出），l 是边音（气从舌头两边出）";
  if (ans === "l") return "💡 l 是边音（气从舌头两边出），n 是鼻音（气从鼻子出）";
  if (ans === "b") return "💡 右下半圆 b b b，左下半圆是 d";
  if (ans === "d") return "💡 左下半圆 d d d，右下半圆是 b";
  if (ans === "p") return "💡 右上半圆 p p p，左上半圆是 q";
  if (ans === "q") return "💡 左上半圆 q q q，右上半圆是 p";
  if (ans === "ui") return "💡 ui 是 u 在前 i 在后；iu 是 i 在前 u 在后";
  if (ans === "iu") return "💡 iu 是 i 在前 u 在后；ui 是 u 在前 i 在后";
  if (ans === "ü") return "💡 ü 是小鱼吐泡泡（有两点），u 是乌鸦（没有点）";
  if (ans === "u") return "💡 u 是乌鸦（没有点），ü 才是小鱼（有两点）";
  if (ans === "ie") return "💡 ie 读“椰”，ei 读“诶”，顺序不一样";
  if (ans === "ei") return "💡 ei 读“诶”，ie 读“椰”，顺序不一样";
  if (ans === "üe") return "💡 üe 是小鱼 ü 加 e（月），ie 是 i 加 e（椰）";
  return "";
}

function buildQuiz(){
  const lv = DATA[curLevel];
  const qs = [];
  lv.items.forEach(it=>{
    const ch = pick(it.chars);
    const parts = pinyinParts(ch);
    const whole = (it.type === "整体认读音节");
    let kind;
    if (whole){
      /* 整体认读音节不拆分，考辨声调或选读音 */
      kind = Math.random() < 0.5 ? "tone" : "whole";
    } else {
      const r = Math.random();
      kind = r < 0.4 ? "spell" : r < 0.6 ? "initial" : r < 0.8 ? "final" : "tone";
      if (!parts.ini && (kind === "spell" || kind === "initial")) kind = Math.random() < 0.5 ? "final" : "tone";
    }
    const q = { kind, ch, parts, whole };
    if (kind === "initial"){
      q.options = shuffle([parts.ini].concat(confusable(parts.ini, CONFUSE_INI, INITIALS, 3)));
      q.answer = parts.ini;
    } else if (kind === "final"){
      q.options = shuffle([parts.fin0].concat(confusable(parts.fin0, CONFUSE_FIN, ALL_FIN, 3)));
      q.answer = parts.fin0;
    } else if (kind === "tone"){
      const st = stripTone(ch.py);
      q.options = shuffle([1,2,3,4].map(t=>addTone(st.base, t)));
      q.answer = ch.py;
    } else if (kind === "whole"){
      const base = stripTone(ch.py).base;
      q.options = shuffle([base].concat(confusable(base, CONFUSE_WHOLE, ALL_WHOLE, 3)));
      q.answer = base;
    } else { /* spell 两步拼读 */
      q.iniOptions = shuffle([parts.ini].concat(confusable(parts.ini, CONFUSE_INI, INITIALS, 3)));
      q.finOptions = shuffle([parts.fin0].concat(confusable(parts.fin0, CONFUSE_FIN, ALL_FIN, 3)));
    }
    qs.push(q);
  });
  return shuffle(qs);
}
function startQuiz(){
  quiz = buildQuiz(); qIndex = 0; qCorrect = 0;
  const lv = DATA[curLevel];
  const [c1,c2] = LEVEL_COLORS[curLevel % LEVEL_COLORS.length];
  $("quizBadge").textContent = "第 "+(curLevel+1)+" 关 · "+lv.emoji+lv.name;
  $("quizBadge").style.background = "linear-gradient(135deg,"+c1+","+c2+")";
  renderQuestion();
  show("screenQuiz");
}
function revealText(q){
  const p = q.parts;
  if (q.whole) return q.ch.c + " " + q.ch.py + " —— 整体认读音节，不用拼，直接读";
  if (p.ini) return q.ch.c + " " + q.ch.py + " ＝ 声母 " + p.ini + " ＋ 韵母 " + p.fin0 + "（" + p.fin + "）";
  return q.ch.c + " " + q.ch.py + " ＝ 韵母 " + p.fin0 + "（" + p.fin + "）";
}
function renderQuestion(){
  qAnswered = false;
  const q = quiz[qIndex];
  $("quizDots").innerHTML = quiz.map((_,i)=>
    '<div class="q-dot'+(i<qIndex?" done":(i===qIndex?" now":""))+'"></div>').join("");
  $("qCount").textContent = "第 "+(qIndex+1)+" / "+quiz.length+" 题 · 已答对 "+qCorrect+" 题";
  const c = q.ch.c;
  if (q.kind === "initial") $("qPrompt").innerHTML = "听一听，选出“"+c+"”的<b>声母</b>";
  else if (q.kind === "final") $("qPrompt").innerHTML = "听一听，选出“"+c+"”的<b>韵母</b>";
  else if (q.kind === "tone") $("qPrompt").innerHTML = "“"+c+"”的正确<b>读音</b>是哪个？";
  else if (q.kind === "whole") $("qPrompt").innerHTML = "“"+c+"”的<b>读音</b>是哪个？";
  else $("qPrompt").innerHTML = "拼一拼：“"+c+"”的拼音";
  $("qPrompt").style.cursor = "pointer";
  $("qPrompt").onclick = ()=> { speak(c); if(MOUTH_MAP[c]) showMouth(c); };
  $("qChar").textContent = c;
  $("qChar").onclick = ()=> { speak(c); if(MOUTH_MAP[c]) showMouth(c); };
  $("qFeedback").innerHTML = "";
  $("spellBuilt").textContent = "";
  if (q.kind === "spell"){ spellStep = 0; spellMistake = false; renderSpellStep(q); }
  else {
    const opts = $("qOptions");
    opts.innerHTML = "";
    q.options.forEach(opt=>{
      const b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = opt;
      b.onclick = ()=> answer(b, opt, q);
      opts.appendChild(b);
    });
  }
  setTimeout(()=>speak(c), 350);
}
function nextQuestion(){
  if (qIndex < quiz.length - 1){ qIndex++; renderQuestion(); }
  else finishQuiz();
}
function answer(btn, val, q){
  if (qAnswered) return;
  qAnswered = true;
  const buttons = document.querySelectorAll("#qOptions .opt-btn");
  buttons.forEach(b=>b.disabled = true);
  const fb = $("qFeedback");
  const correct = (val === q.answer);
  if (correct){
    qCorrect++;
    btn.classList.add("correct"); sfxCorrect();
    fb.innerHTML = '<span class="good">'+pick(["拼对啦！🎉","答对啦！👏","真厉害！🌟","完全正确！🥳","好样的！💪"])+'</span>'+
      '<div class="q-reveal">'+revealText(q)+'</div>';
  } else {
    btn.classList.add("wrong");
    buttons.forEach(b=>{ if (b.textContent === q.answer) b.classList.add("correct"); });
    sfxWrong();
    const tip = confuseHint(q.answer);
    fb.innerHTML = '<span class="bad">😅 正确答案：'+q.answer+'</span>'+
      '<div class="q-reveal">'+revealText(q)+(tip ? '<br>'+tip : '')+'</div>';
  }
  setTimeout(nextQuestion, correct ? 1200 : 2000);
}
/* --- 两步拼读题 --- */
function renderSpellStep(q){
  qAnswered = false;
  const opts = $("qOptions");
  opts.innerHTML = "";
  const label = document.createElement("div");
  label.className = "spell-label";
  label.textContent = spellStep === 0 ? "第一步：选出声母" : "第二步：选出韵母";
  opts.appendChild(label);
  const list = spellStep === 0 ? q.iniOptions : q.finOptions;
  list.forEach(opt=>{
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.textContent = opt;
    b.onclick = ()=> spellAnswer(b, opt, q);
    opts.appendChild(b);
  });
  updateSpellBuilt(q, false);
}
function updateSpellBuilt(q, finished){
  const p = q.parts;
  let txt;
  if (spellStep === 0) txt = "＿ ＋ ＿ ＝ ？";
  else if (!finished) txt = p.ini + " ＋ ＿ ＝ ？";
  else txt = p.ini + " ＋ " + p.fin0 + " ＝ " + q.ch.py;
  $("spellBuilt").textContent = txt;
}
function spellAnswer(btn, val, q){
  if (qAnswered) return;
  qAnswered = true;
  const buttons = document.querySelectorAll("#qOptions .opt-btn");
  buttons.forEach(b=>b.disabled = true);
  if (spellStep === 0){
    if (val === q.parts.ini){
      btn.classList.add("correct"); sfxCorrect();
    } else {
      spellMistake = true; btn.classList.add("wrong"); sfxWrong();
      buttons.forEach(b=>{ if (b.textContent === q.parts.ini) b.classList.add("correct"); });
    }
    setTimeout(()=>{ spellStep = 1; renderSpellStep(q); }, val === q.parts.ini ? 750 : 1400);
  } else {
    const fb = $("qFeedback");
    const finOK = (val === q.parts.fin0);
    if (finOK) btn.classList.add("correct");
    else {
      btn.classList.add("wrong");
      buttons.forEach(b=>{ if (b.textContent === q.parts.fin0) b.classList.add("correct"); });
    }
    const correct = finOK && !spellMistake;
    if (correct){
      qCorrect++; sfxCorrect();
      fb.innerHTML = '<span class="good">拼对啦！'+q.ch.py+' 🎉</span>'+
        '<div class="q-reveal">'+revealText(q)+'</div>';
    } else {
      sfxWrong();
      const hint = (!finOK) ? "韵母选错啦" : "声母那一步选错了哦";
      const tip = confuseHint(!finOK ? q.parts.fin0 : q.parts.ini);
      fb.innerHTML = '<span class="bad">😅 '+hint+'，正确答案见下方</span>'+
        '<div class="q-reveal">'+revealText(q)+(tip ? '<br>'+tip : '')+'</div>';
    }
    updateSpellBuilt(q, true);
    setTimeout(nextQuestion, correct ? 1300 : 2100);
  }
}
$("quizBack").onclick = ()=>{
  sfxClick();
  if (confirm("确定要放弃本次闯关吗？进度将不会保存。")){
    renderMap(); show("screenMap");
  }
};

/* ==================== 结果页 ==================== */
function finishQuiz(){
  const lv = DATA[curLevel];
  const n = quiz.length;
  const ratio = qCorrect / n;
  let stars = 0;
  if (ratio === 1) stars = 3;
  else if (ratio >= 0.6) stars = 2;
  else if (ratio >= 0.4) stars = 1;
  if (stars > progress.stars[curLevel]) progress.stars[curLevel] = stars;
  saveProgress();
  const passed = stars >= 1;
  const last = curLevel === DATA.length-1;
  const [c1,c2] = LEVEL_COLORS[curLevel % LEVEL_COLORS.length];
  let title, msg, emoji;
  if (ratio === 1){ emoji="🏆"; title="满分通关！"; msg="太厉害了，一个都没错！你是拼音小天才！"; }
  else if (passed){ emoji="🎉"; title="闯关成功！"; msg="很棒哦！回去复习一下错题，下次拿满星！"; }
  else { emoji="💪"; title="差一点点！"; msg="别灰心，先回学习卡复习一下，再来挑战吧！"; }
  let html =
    '<div class="result-emoji">'+emoji+'</div>'+
    '<div class="result-title">'+title+'</div>'+
    '<div class="result-stars">'+
      [1,2,3].map(i=>'<span class="star">'+(i<=stars?"⭐":"☆")+'</span>').join("")+
    '</div>'+
    '<div class="result-msg">'+msg+'</div>'+
    '<div class="result-score">本关「'+lv.name+'」：答对 '+qCorrect+' / '+n+' 题</div>'+
    '<div class="result-btns">'+
      '<button class="result-btn" style="background:linear-gradient(135deg,#B8A4D8,#9B8EC8);" onclick="retry()">🔁 再闯一次</button>'+
      '<button class="result-btn" style="background:linear-gradient(135deg,'+c1+','+c2+');" onclick="goMap()">🗺️ 回到地图</button>'+
      (passed && !last ? '<button class="result-btn" style="background:linear-gradient(135deg,#FF9A76,#FF6B9B);" onclick="nextLevel()">➡️ 下一关</button>' : '')+
    '</div>';
  if (passed && last && totalStars() >= DATA.length*3){
    html += '<div style="margin-top:16px;font-size:16px;color:var(--purple);font-weight:bold;">👑 你已集齐全部星星，拼音大王就是你！</div>';
  }
  $("resultCard").innerHTML = html;
  show("screenResult");
  if (stars === 3){ sfxStar(); confetti(); }
  else if (passed){ sfxStar(); }
}
function retry(){ sfxClick(); startQuiz(); }
function goMap(){ sfxClick(); renderMap(); show("screenMap"); }
function nextLevel(){ sfxClick(); curLevel++; curItem = 0; renderLearn(); show("screenLearn"); }

/* ==================== 启动 ==================== */
$("startQuiz").onclick = ()=>{ sfxClick(); startQuiz(); };
$("resetBtn").onclick = ()=>{
  if (confirm("确定要清空所有闯关进度和星星吗？")){
    progress = { stars: DATA.map(()=>0) };
    saveProgress(); renderMap(); toast("进度已重置");
  }
};
loadProgress();
renderMap();
</script>
